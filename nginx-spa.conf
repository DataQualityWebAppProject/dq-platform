server {
    listen 80 default_server;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing - all frontend routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy for API calls - avoids Mixed Content and CORS issues
    location /api/ {
        proxy_pass https://86iruyzin2.execute-api.us-east-1.amazonaws.com/;
        proxy_set_header Host 86iruyzin2.execute-api.us-east-1.amazonaws.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
    }
}
